site_name: "One-Year New Testament Chronological Bible Study"
site_description: "A 52-week chronological journey through the New Testament"
site_author: "Dewayne VanHoozer"

use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Merriweather
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - def_list
  - tables
  - admonition

extra_css:
  - css/print-overrides.css

extra_javascript:
  - https://www.biblegateway.com/public/link-to-us/tooltips/bglinks.js
  - js/bglinks-config.js

plugins:
  - search
  - tags:
      tags_file: tags.md
  - print-site:
      add_cover_page: true
      add_table_of_contents: false
      enumerate_headings: false
      add_full_urls: true

exclude_docs: |
  LICENSE
  requirements.txt
  COMMITS.md

